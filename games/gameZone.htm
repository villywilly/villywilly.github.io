<!DOCTYPE html>
<html>
    <head>
        <title>
            VillyWilly - Villy's Game Zone!
        </title>
    </head>
    <body>
        <link rel="stylesheet" href="gameZone.css">
        <div id="banner" class="banner">
          <div class="banner-content">
            <h3>Game Zone and minecraft clients have left VillyWilly.github.io!</h3>
            <p>If you still want to access these, go to gn-bio.github.io, or click the green button</p>
            <button id="closeBtn" class="close-btn">&times;</button>
            <button id="actionBtn" class="action-btn">gn-bio</button>
          </div>
        </div>   
        <div class="Title">
            <h3>
                <a href="../index.html" class="buttonBlack">Go back</a>
            </h3>
        </div>
        <footer>
            <div class="disclaimer">
                <hr>
                <h1>
                    Disclaimer: You shant play these in class
                </h1>
                <hr>
            </div>
        </footer>
    </body>
            <script>
            document.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('banner');
            const closeBtn = document.getElementById('closeBtn');
            const actionBtn = document.getElementById('actionBtn');

             // Close banner on X click
             closeBtn.addEventListener('click', () => {
            banner.style.opacity = '0';
            banner.style.height = '0';
            banner.style.padding = '0';
            setTimeout(() => {
              banner.remove();
            }, 300); // Match CSS transition duration
          });

          // Close banner on action button click
          actionBtn.addEventListener('click', () => {
            banner.style.opacity = '0';
                banner.style.height = '0';
            banner.style.padding = '0';
            window.location.href = "https://gn-bio.github.io";
            setTimeout(() => {
                  banner.remove();
                }, 300);
              });
            });   
        </script>
</html>
